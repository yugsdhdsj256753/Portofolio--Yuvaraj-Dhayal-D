<style>*{box-sizing:border-box}
html{
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body{
  margin:0;
  padding:0;
  background:#fff;
  color:#333;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.65;
  font-weight:400;
}
.site-header,main,footer{
  width:850px;
  max-width:calc(100% - 50px);
  margin-left:auto;
  margin-right:auto;
}
.site-header{padding-top:24px}
nav{text-align:right}
nav a{
  color:#c2185b;
  text-decoration:none;
  margin-left:21px;
  font-size:15px;
  font-weight:400;
}
nav a:hover{text-decoration:underline}
nav a.active{color:#333}
main{margin-top:46px;margin-bottom:58px}
.intro{
  display:grid;
  grid-template-columns:minmax(0,1fr) 220px;
  gap:52px;
  align-items:start;
}
h1{
  margin:0 0 3px;
  color:#2f2f2f;
  font-size:29px;
  line-height:1.25;
  font-weight:400;
  letter-spacing:0;
}
.title{
  margin:0 0 23px;
  color:#444;
  font-size:17px;
  line-height:1.45;
  font-weight:400;
}
.intro p{margin:0 0 15px}
.profile-photo{
  display:block;
  width:220px;
  height:220px;
  object-fit:cover;
  border-radius:2px;
}
.affiliation{
  margin:12px 0 0;
  color:#444;
  font-size:14px;
  line-height:1.5;
  font-weight:400;
}
.affiliation strong{color:#333;font-weight:400}
.section-title{
  margin:47px 0 15px;
  color:#333;
  font-size:23px;
  line-height:1.3;
  font-weight:400;
}
.posts{margin-top:0}
.post{
  display:block;
  margin-bottom:6px;
  font-size:15px;
  line-height:1.55;
  font-weight:400;
}
.post time{color:#555;font-weight:400}
.post time::after{content:"  |  "}
.post a{
  color:#c2185b;
  text-decoration:none;
  font-weight:400;
}
.post a:hover{text-decoration:underline}
.contact p{margin-bottom:14px}
.contact a{
  color:#c2185b;
  text-decoration:none;
  margin-right:15px;
  font-weight:400;
}
.contact a:hover{text-decoration:underline}
footer{
  padding:20px 0 30px;
  border-top:1px solid #eee;
  color:#888;
  font-size:13px;
  font-weight:400;
}
article{margin:34px 0}
article h2{
  font-size:21px;
  line-height:1.35;
  font-weight:400;
  color:#333;
  margin:0 0 3px;
}
article .date{font-size:13px;color:#777;margin-bottom:12px}
article a{color:#c2185b}
@media(max-width:720px){
 .site-header,main,footer{max-width:calc(100% - 32px)}
 .intro{grid-template-columns:1fr;gap:22px}
 .profile-photo{width:200px;height:200px}
 h1{font-size:28px}
 .post{display:block;margin-bottom:12px}
}
</style>
</head>
